<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gameland</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <button id="profile-badge" class="profile-badge" aria-label="Switch profile">
    <span>👤</span>
    <span id="profile-name">Guest</span>
  </button>

  <header class="header">
    <h1 class="site-title">Gameland</h1>
    <p class="site-subtitle">A little collection of games, made one at a time.</p>
  </header>

  <main class="grid" id="game-grid"></main>

  <footer class="footer">
    <p>More games are on the way 🎮</p>
    <p class="credit">Created by April Georfo</p>
  </footer>

  <div id="profile-modal" class="profile-modal hidden">
    <div class="profile-modal-content">
      <button id="profile-modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h2>Who's playing?</h2>
      <p class="profile-modal-sub">Pick a profile or create a new one. Scores and leaderboards are saved on this device only.</p>
      <div id="profile-list" class="profile-list"></div>
      <button id="profile-manage-btn" type="button" class="profile-manage-btn">Manage profiles</button>
      <form id="profile-form" class="profile-form">
        <input id="profile-input" type="text" placeholder="Enter a name" maxlength="24" autocomplete="off">
        <button type="submit" class="profile-add-btn">Add</button>
      </form>
      <button id="profile-guest-btn" class="profile-guest-btn">Continue as guest</button>
    </div>
  </div>

<script src="profiles.js"></script>
<script src="games.js"></script>
<script src="script.js"></script>
</body>
</html>
